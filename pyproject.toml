[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litresearch"
version = "0.1.0-dev"
description = "Personal literature radar: paper recommendations, a reading queue and a reading game on top of a Paperpile library"
readme = "README.md"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kai Horny" }]
requires-python = ">=3.11"
keywords = ["literature", "paper recommendation", "paperpile", "reading list", "openalex", "specter2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "bibtexparser>=2.0.0b7",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "markdown>=3.5",
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13",
    "sqlmodel>=0.0.16",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
litresearch = "litresearch.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"litresearch.web" = ["templates/*.html", "static/*", "documentation.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: calls real web APIs (enable with --network)"]
filterwarnings = [
    "error",
    # fastapi's TestClient still uses httpx; harmless deprecation notice
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI parameters through default values
extend-immutable-calls = ["typer.Argument", "typer.Option"]
