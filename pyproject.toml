[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litresearch"
version = "0.1.0-dev"
description = "Personal literature radar on top of a Paperpile library"
readme = "README.md"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kai Horny" }]
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=2.0.0b7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.16",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
litresearch = "litresearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
