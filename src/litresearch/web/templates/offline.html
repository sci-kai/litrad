{% extends "_bare.html" %}
{% block title %}Offline{% endblock %}
{% block content %}
<div class="card error-card">
  <span class="big" aria-hidden="true">📡</span>
  <h2 style="justify-content:center">You are offline</h2>
  <p>litresearch cannot reach your server. Check your Wi-Fi or VPN and that the server is running. Your data stays on the server and is not stored on this device.</p>
  <div class="row" style="margin-top:1rem">
    <a class="button primary" href="/">🔄 Try again</a>
  </div>
</div>
{% endblock %}
