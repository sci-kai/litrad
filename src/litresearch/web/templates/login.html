<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · litresearch</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div style="min-height:100vh; display:grid; place-items:center; padding:1rem">
  <form class="card" method="post" action="/login" style="width:min(360px, 100%); display:grid; gap:.8rem; text-align:center">
    <div class="brand" style="justify-content:center"><span class="logo">📡</span> litresearch</div>
    <p class="muted" style="margin:0">Your literature radar. Please log in.</p>
    {% if failed %}<div class="notice error" style="margin:0">Wrong password.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button class="primary" style="justify-content:center">🔓 Log in</button>
  </form>
</div>
</body>
</html>
