# Publish to PyPI with Trusted Publishing (no token stored in GitHub).
#
# Tags vX.Y.Z and pre-releases PEP 440 accepts (v0.3.0rc1, v0.3.0-rc.1) are
# published; development tags such as v1.1.0-dev (PEP 440: 1.1.0.dev0) are
# skipped. Run by hand ("Run workflow") to upload to TestPyPI instead.
# One-time setup: see "Releases" in CONTRIBUTING.md.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Decide whether this ref is publishable
        id: decide
        run: |
          python -m pip install packaging
          python - <<'PY'
          import os, re, tomllib
          from packaging.version import InvalidVersion, Version

          ref = os.environ["GITHUB_REF_NAME"]
          project = Version(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          publish = False
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              try:
                  tag = Version(re.sub(r"^v", "", ref))
              except InvalidVersion:
                  print(f"{ref} is not a PEP 440 version: not published")
              else:
                  if tag.is_devrelease:
                      print(f"{ref} is a development version: not published")
                  elif tag != project:
                      raise SystemExit(f"Tag {ref} does not match pyproject version {project}")
                  else:
                      publish = True
          else:
              # manual run: TestPyPI needs a version that is not a dev version either
              publish = not project.is_devrelease
              print(f"manual run, version {project}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"publish={str(publish).lower()}\n")
          PY
      - name: Build
        if: steps.decide.outputs.publish == 'true'
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
