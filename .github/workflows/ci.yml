# Lint and test every push and pull request (offline test suite, no API calls).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Lint
        run: |
          ruff check src tests install.py
          ruff format --check src tests install.py
      - name: Test
        run: pytest -q
