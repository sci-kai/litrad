# Pushing a tag vX.Y.Z (or vX.Y.Z-alpha.N) builds the package and publishes a
# GitHub release with the wheel, the source archive and the CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test before releasing
        run: |
          python -m pip install --editable ".[dev]"
          pytest -q
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "litresearch $GITHUB_REF_NAME" \
            --notes-file notes.md $flags
