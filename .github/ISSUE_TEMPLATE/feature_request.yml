name: Feature request or idea
description: Suggest something new or a change to how litrad works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the reading situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could litrad help? Mock-ups, examples or links are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
