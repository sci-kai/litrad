# litresearch configuration -- copy to config/config.yaml and adapt.
# Dates follow ISO 8601 (YYYY-MM-DD).

# Machine settings and the DEFAULTS of every profile. Each profile keeps its own
# data in data/profiles/<profile>/ and may override topics, excluded_terms,
# selection, sources, queue, library and paths.bibtex in its settings.yaml
# (written by the web UI).

paths:
  # one folder per profile: litresearch.sqlite, library.bib, settings.yaml
  profiles_dir: data/profiles
  # data from before profiles existed (can be taken over as a profile)
  bibtex: data/paperpile/library.bib
  database: data/litresearch.sqlite
  cache_dir: data/cache
  obsidian_vault: n/a

library:
  # Paperpile labels without topical meaning (case-insensitive)
  ignore_labels: ["Import Mendeley"]

# topics of a profile taken over from existing data; a new profile asks for its own
topics:
  - name: tumor-evolution
    weight: 1.0
    queries: ["clonal evolution cancer", "tumor heterogeneity phylogeny"]
    mesh_terms: ["Clonal Evolution", "Genetic Heterogeneity"]
    seed_dois: []
  - name: liquid-biopsy
    weight: 0.8
    queries: ["circulating tumor DNA", "cfDNA fragmentomics"]
    mesh_terms: ["Circulating Tumor DNA", "Liquid Biopsy"]
    seed_dois: []
  - name: long-read-sv
    weight: 0.7
    queries: ["long-read sequencing structural variants cancer"]
    mesh_terms: []
    seed_dois: []

excluded_terms: ["veterinary"]

sources:
  semanticscholar: true
  # paper search (Library → Find & add, `litresearch search`)
  europepmc: true
  pubmed: true
  biorxiv: true
  openalex: true

api:
  # free key on request: https://www.semanticscholar.org/product/api
  semanticscholar_key: n/a
  # optional; without a key OpenAlex allows a small daily budget
  openalex_key: n/a
  # used for the OpenAlex polite pool and NCBI E-utilities
  contact_email: n/a
  # optional free NCBI key: PubMed allows 10 instead of 3 requests per second
  ncbi_key: n/a

embeddings:
  # s2 = precomputed SPECTER2 from Semantic Scholar;
  # local = own SPECTER2 service; hybrid = s2 first, local for missing papers
  backend: hybrid
  local_url: http://embed-server:8100/v1/embeddings

selection:
  # papers per list (1-5); how deeply you read them is your choice
  n_recommendations: 5
  fresh_window_months: 6
  landmark_min_percentile: 95
  mmr_lambda: 0.7
  landmark_max_age_years: 15
  results_per_query: 25
  cooldown_weeks: 8
  # remind me to get new recommendations after this many days (0 = never)
  reminder_days: 7
  weights:
    relevance: 0.5
    impact: 0.3
    timeliness: 0.2

queue:
  # small on purpose: finish or drop papers before adding new ones
  max_size: 5

game:
  # DEFAULTS FOR A NEW PROFILE. When a profile is created (welcome screen or
  # `litresearch profile create`), these rules are copied and locked; changing
  # them later only affects the next profile. All keys (points per level,
  # bonuses, levels, badge_targets, ...) are listed in docs/documentation.md (Gamification).
  # weekly quest: papers read at least to depth "read" / at least "skimmed"
  weekly_detail_goal: 1
  weekly_skim_goal: 2

backup:
  # consistent database snapshots + portable progress exports (JSON);
  # point this to a cloud-synced folder, but keep paths.database local
  dir: data/backups
  keep: 14
  # `litresearch serve` backs up at start and then every N hours (0 = off)
  interval_hours: 24

llm:
  enabled: true
  # any OpenAI-compatible endpoint (LM Studio, Ollama, institutional server)
  base_url: http://llm-server:1234/v1
  model: qwen3-14b
  api_key: n/a

schedule:
  # cron syntax: minute hour day-of-month month day-of-week
  cron: "0 6 * * 1"

web:
  # where `litresearch serve` listens:
  #   local       = only this computer
  #   all         = every network
  #   eth0, wlan0 = only that network (see `litresearch serve --list-networks`)
  #   or an IPv4 address of this computer
  # anything but local needs a password (`litresearch set-password`)
  host: local
  port: 8080
  password_hash: n/a
